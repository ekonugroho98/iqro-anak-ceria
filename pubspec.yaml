name: iqro_anak_ceria
description: Belajar mengaji Iqro dan mewarnai huruf hijaiyah untuk anak Muslim
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.2  # Text-to-Speech untuk pelafalan huruf Arab

  # UI Helpers
  auto_size_text: ^3.0.0

  # Ads
  google_mobile_ads: ^5.2.0

  # IAP
  in_app_purchase: ^3.2.0

  # Utils
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/hijaiyah/
    - assets/images/coloring/
    - assets/images/characters/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/stickers/
    - assets/audio/hijaiyah/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/voice/
    - assets/animations/